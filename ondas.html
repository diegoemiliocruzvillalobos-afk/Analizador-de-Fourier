<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintetizador de Series de Fourier</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        h2 { grid-column: 1 / -1; text-align: center; color: #00ffcc; margin-top: 0; }
        canvas {
            width: 100%;
            height: 250px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border: 1px solid #00ffcc;
        }
        .controls { display: flex; flex-direction: column; gap: 15px; }
        .control-group {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #b0c4de; }
        input[type="range"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.9);
            font-family: 'Fira Code', monospace;
        }
        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .value-display { float: right; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Analizador de Fourier (Sonido y Gráfica)</h2>
    
    <div class="controls">
        <div class="control-group">
            <label>Forma de Onda:</label>
            <select id="waveType">
                <option value="square">Cuadrada</option>
                <option value="sawtooth">Diente de Sierra</option>
                <option value="triangle">Triangular</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Términos (Armónicos): <span id="termsVal" class="value-display">5</span></label>
            <input type="range" id="terms" min="1" max="50" value="5">
        </div>

        <div class="control-group">
            <label>Frecuencia / Aceleración: <span id="freqVal" class="value-display">440 Hz</span></label>
            <input type="range" id="freq" min="50" max="1000" value="440">
        </div>

        <button id="playBtn">▶ Play / Pausa</button>
    </div>

    <div>
        <canvas id="grafica"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('grafica');
    const ctx = canvas.getContext('2d');
    const waveTypeSel = document.getElementById('waveType');
    const termsSlider = document.getElementById('terms');
    const freqSlider = document.getElementById('freq');
    const playBtn = document.getElementById('playBtn');
    
    let audioCtx;
    let oscillator;
    let gainNode;
    let isPlaying = false;
    let time = 0;

    // Ajustar tamaño real del canvas
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    // Actualizar etiquetas numéricas
    termsSlider.oninput = () => { 
        document.getElementById('termsVal').textContent = termsSlider.value; 
        updateAudio(); 
    };
    freqSlider.oninput = () => { 
        document.getElementById('freqVal').textContent = freqSlider.value + " Hz"; 
        if(oscillator) oscillator.frequency.value = freqSlider.value; 
    };
    waveTypeSel.onchange = updateAudio;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new window.AudioContext();
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.1; // Volumen bajo
            gainNode.connect(audioCtx.destination);
        }
    }

    function createFourierWave() {
        const terms = parseInt(termsSlider.value);
        const type = waveTypeSel.value;
        
        const real = new Float32Array(terms + 1);
        const imag = new Float32Array(terms + 1);
        
        // Fórmulas matemáticas de los coeficientes de Fourier para reconstruir la onda
        for (let n = 1; n <= terms; n++) {
            if (type === 'square' && n % 2 !== 0) {
                imag[n] = 4 / (n * Math.PI); // bn para impares
            } else if (type === 'sawtooth') {
                imag[n] = (2 * Math.pow(-1, n + 1)) / (n * Math.PI); // bn para todos
            } else if (type === 'triangle' && n % 2 !== 0) {
                const k = (n - 1) / 2;
                real[n] = (8 * Math.pow(-1, k)) / (Math.pow(n, 2) * Math.pow(Math.PI, 2)); // an para impares
            }
        }
        return audioCtx.createPeriodicWave(real, imag);
    }

    function updateAudio() {
        if (isPlaying && oscillator) {
            oscillator.setPeriodicWave(createFourierWave());
        }
    }

    playBtn.onclick = () => {
        initAudio();
        if (isPlaying) {
            oscillator.stop();
            isPlaying = false;
            playBtn.innerHTML = "▶ Play / Pausa";
        } else {
            oscillator = audioCtx.createOscillator();
            oscillator.setPeriodicWave(createFourierWave());
            oscillator.frequency.value = freqSlider.value;
            oscillator.connect(gainNode);
            oscillator.start();
            isPlaying = true;
            playBtn.innerHTML = "⏸ Pausa";
        }
    };

    // Función matemática para dibujar la serie de Fourier en el Canvas
    function getFourierValue(t, terms, type) {
        let val = 0;
        for (let n = 1; n <= terms; n++) {
            if (type === 'square' && n % 2 !== 0) {
                val += (4 / (n * Math.PI)) * Math.sin(n * t);
            } else if (type === 'sawtooth') {
                val += ((2 * Math.pow(-1, n + 1)) / (n * Math.PI)) * Math.sin(n * t);
            } else if (type === 'triangle' && n % 2 !== 0) {
                const k = (n - 1) / 2;
                val += ((8 * Math.pow(-1, k)) / (Math.pow(n, 2) * Math.pow(Math.PI, 2))) * Math.cos(n * t);
            }
        }
        return val;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const terms = parseInt(termsSlider.value);
        const type = waveTypeSel.value;
        const speed = parseFloat(freqSlider.value) / 10000;
        
        ctx.beginPath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        
        for (let x = 0; x < canvas.width; x++) {
            // Mapear píxeles a tiempo
            const t = (x * 0.05) + time; 
            const y = getFourierValue(t, terms, type);
            
            // Escalar para ajustar al canvas
            const plotY = (canvas.height / 2) - (y * 50); 
            
            if (x === 0) ctx.moveTo(x, plotY);
            else ctx.lineTo(x, plotY);
        }
        ctx.stroke();
        
        if (isPlaying) {
            time += speed * 50; 
        }
        requestAnimationFrame(draw);
    }

    // Iniciar bucle de dibujo
    draw();
</script>

</body>
</html>
